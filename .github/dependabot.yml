# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# npm minor/patch updates are handled nightly by nightly-minor-deps-release.yml; Dependabot
# covers majors (as PRs to review) and GitHub Actions.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Types must track the Node runtime (26 LTS: CI, Docker, .nvmrc), not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
