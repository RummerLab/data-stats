# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# npm is deliberately not listed: Dependabot runs pnpm on a Node older than the required 26,
# and `engineStrict` makes every npm update job fail (ERR_PNPM_UNSUPPORTED_ENGINE). In-major
# npm updates come from nightly-minor-deps-release.yml; major upgrades are done by hand.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
