# Deploy from the published GHCR image (data.physioshark.org)
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Put the Physioshark workbooks in ./data (or set DATA_PATH). They are mounted read-only and
# re-imported automatically within a minute of any change: drop in a new season's workbook
# and the site updates without a restart.
#
# Pin a version with DATA_STATS_IMAGE_TAG=0.1 (tags have no v prefix: 0.1.0, 0.1, 0, latest)
# Bind loopback only behind a reverse proxy / Cloudflare Tunnel: HOST_BIND=127.0.0.1 (default)

services:
  app:
    image: ghcr.io/rummerlab/data-stats:${DATA_STATS_IMAGE_TAG:-latest}
    container_name: physioshark-data
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    ports:
      - '${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8098}:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
      - cache:/cache
    restart: unless-stopped

volumes:
  cache:
