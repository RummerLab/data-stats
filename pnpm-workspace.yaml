# pnpm 11+ reads project config from here (not package.json#pnpm / most .npmrc keys).
allowBuilds:
  better-sqlite3: true
  esbuild: true

engineStrict: true
shamefullyHoist: true

# Security fixes for transitive tooling dependencies (#144).
overrides:
  esbuild@<0.28.1: 0.28.1
  minimatch@<11.0.1: 11.0.1

# pnpm 12 defaults to a release-age gate that breaks frozen CI installs when
# the lockfile already pins recently published transitive deps. Trust the lockfile.
minimumReleaseAge: 0

# Avoid re-running install before every script when modules are briefly locked (dev server).
verifyDepsBeforeRun: false
